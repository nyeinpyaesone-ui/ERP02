version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-erp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-ai_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_admin} -d ${DB_NAME:-ai_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - erp-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp-worker
    command: python -m app.workers.event_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-erp_admin}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-ai_erp}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-erp_user}:${RABBITMQ_PASS:-changeme}@rabbitmq:5672/
      - OLLAMA_BASE_URL=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY:-supersecretkeychangeme}
      - DEBUG=${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend:/app
    networks:
      - erp-network
    restart: unless-stopped
    deploy:
      replicas: 2

  ollama:
    image: ollama/ollama:latest
    container_name: erp-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - erp-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-erp_admin}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-ai_erp}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-erp_user}:${RABBITMQ_PASS:-changeme}@rabbitmq:5672/
      - OLLAMA_BASE_URL=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY:-supersecretkeychangeme}
      - DEBUG=${DEBUG:-false}
      - UVICORN_WORKERS=4
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ../backend:/app
    networks:
      - erp-network
    restart: unless-stopped

  admin-portal:
    build:
      context: ../frontend/admin-portal
      dockerfile: Dockerfile
    container_name: erp-admin-portal
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - erp-network
    restart: unless-stopped

  client-dashboard:
    build:
      context: ../frontend/client-dashboard
      dockerfile: Dockerfile
    container_name: erp-client-dashboard
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - erp-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: erp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin-portal
      - client-dashboard
    networks:
      - erp-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - erp-network

  grafana:
    image: grafana/grafana:latest
    container_name: erp-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - erp-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  erp-network:
    driver: bridge